<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashed Line</title>
<style>
  hr.dashed {
    border: none;         
    border-top: 2px dashed #000;  
    height: 0;             
    margin: 20px 0;        
  }
</style>
</head>
<body>
<p>Line 1</p>
<hr class="dashed">
<p>Line 2</p>
<hr class="dashed">
<p>Line 3</p>
</body>
</html>
